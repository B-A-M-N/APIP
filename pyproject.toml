[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apip-beta"
version = "0.1.0b1"
description = "APIP public beta — deterministic, AI-free defensive control plane (ingest → decision ledger → exact-FQDN RPZ shadow/canary enforcement)"
readme = "PRODUCT.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
  { name = "B-A-M-N", email = "benevolentjoker@gmail.com" },
]
keywords = [
  "security",
  "network-access-control",
  "deterministic",
  "dns-rpz",
  "control-plane",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
# The DECISION PATH is stdlib-only by design (docs/28 no-AI invariant): it
# imports nothing beyond the standard library, so a decision can never pull
# an inference SDK. The dependencies below are the SERVICE surface only —
# HTTP transport (fastapi/uvicorn), PostgreSQL persistence (psycopg2), and
# the operator CLI (click). None of them sits between evidence and decision.
dependencies = [
  "click>=8.1",
  "fastapi>=0.110",
  # fastapi 0.141 pins starlette<0.38; a newer starlette breaks Router init.
  "starlette>=0.37.2,<0.38.0",
  "uvicorn>=0.29",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "jsonschema>=4.20",
]

# The product console script is `apip`. The reference scaffold (reference/,
# package `apip-reference`) ships the same script name for its offline
# evaluation tooling — install ONE of the two per environment. The
# differential test suite never imports the two packages into one process:
# the oracle runs as a subprocess on reference/src (see tests/oracle_client.py).
[project.scripts]
apip = "apip.cli.main:cli"

[project.urls]
Homepage = "https://example.invalid/apip"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
