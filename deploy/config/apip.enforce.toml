# Local acceptance-test config for APIP — ENFORCE posture against the lab
# resolver on 127.0.0.1:5353 (lab/resolver.py). NOT for production.
# DB password + operator token are provided via env at run time.
[api]
host = "127.0.0.1"
port = 8511

[database]
host = "127.0.0.1"
port = 5432
dbname = "apip"
user = "apip"
connect_timeout_s = 5

[controller]
reconcile_interval_s = 2
verify_interval_s = 30
default_action_ttl_s = 60
max_action_ttl_s = 180

[adapter]
rpz_mode = "ENFORCE"
zone_dir = "/tmp/apip/rpz"
zone_name = "apip.shadow.invalid"
reload_command = ""
authorized_domains = ["operator.test", "invalid"]
# the lab resolver re-reads the zone per query; no reload command needed.
verify_query_server = "127.0.0.1"
verify_query_port = 5353
verify_timeout_s = 3.0