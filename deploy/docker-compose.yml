# APIP public-beta deployment: controller + PostgreSQL durable ledger.
#
# The DNS resolver itself is intentionally NOT part of this compose — RPZ is
# applied to a resolver the OPERATOR authorizes and manages (an operator-owned
# BIND-compatible recursive resolver). SHADOW mode (default) publishes a
# monitor-only zone file and performs no live resolver change, so the safest
# posture is usable with no resolver wiring at all.
#
# Quick start:
#   cp deploy/.env.example .env  # then fill in generated secrets
#   mkdir config && cp deploy/config/apip.toml.example config/apip.toml
#                                # then EDIT scope/domains for YOUR deployment
#   docker compose up -d
#   docker compose exec apip apip migrate
#   docker compose exec apip apip status
#
# Never ship real secrets; the values in .env are yours to generate.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-apip}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  apip:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APIP_CONFIG: /etc/apip/apip.toml
      APIP_DB_PASSWORD: ${POSTGRES_PASSWORD:?set a POSTGRES_PASSWORD in .env}
      APIP_OPERATOR_TOKEN: ${APIP_OPERATOR_TOKEN:?set APIP_OPERATOR_TOKEN in .env}
      APIP_SECRET_KEY: ${APIP_SECRET_KEY:?set APIP_SECRET_KEY in .env}
    volumes:
      - rpz:/var/lib/apip/rpz
      # Audit #31: the operator's OWN configuration, read-only. The image's
      # built-in /etc/apip/apip.toml is the example (demo scope, sentinel
      # values); an operator deployment mounts its real config over it.
      # Create ./config/apip.toml before `docker compose up` (see
      # deploy/config/apip.toml.example).
      - ./config/apip.toml:/etc/apip/apip.toml:ro
    # P1 #38: loopback-only publish by default. Remote operator access goes
    # through a TLS-terminating reverse proxy the operator runs — the API
    # itself is bearer-token over plain HTTP and must not cross a network
    # in the clear.
    ports:
      - "127.0.0.1:8510:8510"
    # ENTRYPOINT is `apip`; the compose command is only the subcommand.
    command: ["serve", "--config", "/etc/apip/apip.toml"]

volumes:
  pgdata:
  rpz: