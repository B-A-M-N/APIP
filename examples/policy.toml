policy_version = "2026-09-01.2"
mode = "SHADOW"
scope = "example-tenant"

[thresholds]
observe_m = 40
fqdn_auto_m = 95
fqdn_auto_s = 90
ip_rate_m = 90
ip_rate_s = 85
ip_deny_m = 98
ip_deny_s = 95

# v2: per-rung automation floors (docs/25). Higher rungs are at least as strict.
[thresholds.rungs.L1]
m = 85
s = 75

[thresholds.rungs.L2]
m = 90
s = 80

[thresholds.rungs.L4]
m = 95
s = 90

[thresholds.rungs.L5]
m = 98
s = 95

[limits]
max_auto_ttl_seconds = 3600
# v2.2: blast-radius budget (docs/04 §8) — one batch may propose at most
# this many actions; overflow DEMOTES to OBSERVE with a named reason.
max_new_auto_actions_per_batch = 100
# L1 client-impact budget (docs/25): at most 5% of the tenant's interactive
# transactions challenged/hour; the overflow alarms and auto-reverts to L0.
# The fraction's denominator is MEASURED volume — supplied via the CLI
# --transactions-per-hour flag or the [measurement] block below. Fail
# closed: a set fraction with no measurement = zero challenges survive.
max_challenged_transaction_fraction_per_hour = 0.05
# v2.1.1: L2 rate ceiling (docs/25 client-impact budget). A rate_limit rule
# without a ceiling is not a rule; the drawn ceiling never exceeds this
# nominal value (docs/29 rate_ceiling bounds below).
nominal_rate_ceiling_per_min = 240
# v2.1.1: docs/23 evidence envelope — records scored per indicator cap.
max_evidence_per_indicator = 64

# v2.2: authorized target space (docs/04). Targets outside these prefixes
# are hard-rejected (out_of_authorized_scope) no matter how strong the
# evidence. The example enumerates the documentation ranges its own data
# uses; production MUST enumerate its real scope.
[authorization]
authorized_prefixes = [
  "198.51.100.0/24",
  "203.0.113.0/24",
]
# v2.3 (audit P1-1): explicit resolver/domain scope. A non-IP target is
# authorized iff it equals or is a subdomain of a governed suffix here — it
# is never authorized merely because 'the IP boundary does not apply'. The
# demo data lives under the reserved `.invalid` TLD; production MUST list its
# real domains.
authorized_domains = [
  "invalid",
]

# v2.2 (docs/25 L1 client-impact budget): the measured interactive
# transaction volume of the trailing hour — the denominator the challenge
# fraction is taken against. Operator-supplied telemetry, never invented by
# the scaffold; the CLI --transactions-per-hour flag overrides this when
# both are set. Unset = fail closed for the budget (zero challenges).
[measurement]
interactive_transactions_per_hour = 1000

# v2.3 (audit P0-3): governed infrastructure registry. `dedicated_use` and
# `verified_rollback` are CONTROL-PLANE safety facts — a feed may never
# assert them. They are SERVER-derived only for the values the operator
# lists here as governed infrastructure. A feed asserting one on any other
# value contributes zero (control_plane_claim_unverified). This is what lets
# the demo's `indicator--demo-ip-dedicated` legitimately reach L5 while a
# poisoned feed can never self-grant the same privilege.
[governed]
dedicated_use = [
  "198.51.100.44",
]
verified_rollback = [
  "198.51.100.44",
  "c2-demo.invalid",
  "c2-on-cdn-demo.invalid",
]

# v2.1.1: replay clock (docs/10 deterministic-replay harness). When set,
# evidence freshness is evaluated against this instant and decision
# byte-replay is exact at any later time. Leave unset for live operation.
# The example data is pinned so the packaged demo evaluates identically
# regardless of when it is run.
[replay]
reference_now = "2026-09-01T20:00:00Z"

[safety]
auto_prefix_deny = false
auto_routing = false
auto_wildcard_domain = false
allowlist_precedence = true
no_ai_components = true

# v2: behavioral suite policy (docs/23)
[behavioral]
enabled_families = [
  "beacon_periodicity",
  "dga_likelihood",
  "dns_tunneling",
  "fastflux",
  "volume_anomaly",
  "first_seen_novelty",
  "tls_metadata_mismatch",
]
max_behavioral_m_contribution = 60

[behavioral.corroboration]
distinct_families_for_rate_limit = 2
distinct_families_for_deny = 3
deny_also_requires_external = true

# v3 (audit P1-32): a `[segments.*]` allow-first block was previously carried
# here but the reference RUNTIME does not implement it — a safety-bearing
# field the parser accepted but silently ignored. Per the audit rule (accept
# it => implement it or fail), the runtime now REJECTS `segments` at load, and
# the runnable example no longer ships it. Segment policy (docs/26) remains a
# forward spec of the control-plane contract (docs/29/drafts), not a reference
# behavior — see OpenAPI's DRAFT-FUTURE framing.

# v2: seeded randomization bounds (docs/29). Draws are recorded per decision.
[randomization]
enabled = true
bounds_version = "rv-2026-09-01.1"

[randomization.mechanisms.ttl_jitter]
enabled = true
min = 0.8
max = 1.0
units = "fraction_of_nominal_ttl"

[randomization.mechanisms.rate_ceiling]
enabled = true
min = 0.5
max = 1.0
units = "fraction_of_nominal_ceiling"

# Note (audit P1-7..11): only mechanisms the engine actually wires may be
# declared. A mechanism listed here that the engine does not implement would
# be a silently inert knob — an operator would believe a defense was active
# (challenge sampling, BD threshold dithering) that never happened. The
# reference engine implements exactly: ttl_jitter and rate_ceiling. Anything
# else is rejected at load (unsupported randomization mechanism). These two
# aspirational docs/29 mechanisms (challenge_sampling, threshold_dither) are
# therefore NOT declared here until they are genuinely wired.
